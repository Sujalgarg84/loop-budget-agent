[project]
name = "loop-budget-agent"
version = "0.1.0"
description = "LangGraph agent with loop detection, spend budgets, HITL approvals, and SQLite persistence."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Loop Budget Agent" }]
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[project.scripts]
loop-agent = "loop_budget_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_budget_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["loop_budget_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
